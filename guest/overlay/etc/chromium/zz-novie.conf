# Novie: flags added to every Chromium launch, however it is started -- the panel's Web
# Browser button, a link from Thunar, xdg-open, or the command line.
#
# /usr/lib/chromium/chromium-launcher.sh sources /etc/chromium/*.conf in glob order and each
# one may extend CHROMIUM_FLAGS, so this appends to Alpine's chromium.conf rather than
# replacing it (the name sorts after it; Alpine's --ozone-platform-hint=auto is kept).
#
# --no-first-run is the one that matters. A fresh profile otherwise opens the modal
# "Chromium Additional Terms of Service" dialog in front of the browser window, and the
# profile is fresh on every boot: the guest's disk is a throwaway overlay, so nothing a
# browser writes survives anything but a suspend/resume. That dialog would therefore be the
# first thing between an MCP client and the web every single time, and a client has nothing
# but pixels to recognise it with.
#
# --no-default-browser-check stops the companion infobar asking to be made the default; it
# already is, by /etc/xdg/mimeapps.list and ~novie/.config/xfce4/helpers.rc.
#
# --password-store=basic is the second modal dialog. Chromium's default is to detect a Secret
# Service on the session bus and keep saved passwords there; gnome-keyring, gcr and libsecret
# all arrive as XFCE dependencies, so asking dbus for one *starts* gnome-keyring-daemon, which
# has no keyring yet and activates gcr-prompter to put up "Choose password for new keyring"
# over the browser window. Nothing in the guest ever answers that: there is no keyring to
# unlock on a later boot, because the disk overlay the profile lives in is thrown away. So
# Chromium is told to keep passwords in its own profile instead and never ask the keyring,
# which is also the honest arrangement here -- a password typed into this VM is as throwaway
# as the VM.
CHROMIUM_FLAGS="$CHROMIUM_FLAGS --no-first-run --no-default-browser-check --password-store=basic"
